<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HRMS - Mobile Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.025em;
        }

        .login-bg {
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                var(--bg-page);
        }

        .gradient-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            box-shadow: var(--shadow-primary);
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
    </style>
</head>

<body class="login-bg min-h-screen flex flex-col items-center justify-center p-6 pb-12">

    <div class="w-full max-w-sm space-y-8 animate-in fade-in slide-in-from-bottom-5 duration-700">
        <!-- Logo Area -->
        <div class="text-center">
            <div onclick="handleLogoClick()"
                class="h-20 w-20 bg-[var(--primary)] rounded-[30px] mx-auto flex items-center justify-center shadow-2xl shadow-[rgba(99,102,241,0.2)] rotate-3 transition-transform hover:rotate-0 duration-500 cursor-pointer active:scale-95">>
                <i class="fas fa-fingerprint text-4xl text-white"></i>
            </div>
            <h1 class="mt-8 text-3xl font-black text-slate-900 tracking-tight">HRMS Mobile</h1>
            <p class="mt-2 text-slate-400 font-medium text-sm px-8">Secure your workspace and join your team seamlessly.
            </p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-[40px] p-8 space-y-6">
            <form id="loginForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Employee
                        ID</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                            <i
                                class="fas fa-id-card text-[var(--text-muted)] group-focus-within:text-[var(--primary)] transition-colors"></i>
                        </div>
                        <input type="text" id="employeeId" required
                            class="block w-full pl-12 pr-6 py-5 bg-[var(--bg-secondary)] border-2 border-[var(--border-color)] rounded-3xl outline-none focus:border-[var(--primary)] focus:bg-white transition-all text-[var(--text-primary)] font-semibold text-sm"
                            placeholder="EMP001">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Secure
                        Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                            <i
                                class="fas fa-lock text-[var(--text-muted)] group-focus-within:text-[var(--primary)] transition-colors"></i>
                        </div>
                        <input type="password" id="password" required
                            class="block w-full pl-12 pr-6 py-5 bg-[var(--bg-secondary)] border-2 border-[var(--border-color)] rounded-3xl outline-none focus:border-[var(--primary)] focus:bg-white transition-all text-[var(--text-primary)] font-semibold text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit"
                    class="gradient-btn w-full py-5 text-white font-bold rounded-3xl shadow-2xl shadow-blue-100 mt-4 active:scale-95 transition-transform flex items-center justify-center space-x-3">
                    <span>Unlock Workspace</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">
            Powered by Metal HRMS &bull; v2.0
        </p>
    </div>

    <!-- Developer Settings Modal -->
    <div id="devSettingsModal"
        class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] hidden items-center justify-center p-6">
        <div class="glass-card w-full max-w-sm rounded-[40px] p-8 space-y-6 border-white/20">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-bold text-slate-800">Developer Settings</h3>
                <button onclick="toggleDevSettings()"
                    class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center"><i
                        class="fas fa-times text-slate-400"></i></button>
            </div>
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Server API
                        Base</label>
                    <input type="text" id="customApiInput"
                        class="block w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all text-slate-600 font-mono text-xs"
                        placeholder="http://192.168.0.103:5000/api">
                    <p class="text-[10px] text-slate-400 mt-2 italic px-1">Tip: Use 'http://localhost:5000/api' for ADB
                        reverse.</p>
                </div>
                <div class="flex items-center space-x-3 pt-2">
                    <input type="checkbox" id="testMismatchCheckbox" class="h-4 w-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                    <label for="testMismatchCheckbox" class="text-xs font-bold text-slate-600 uppercase tracking-widest cursor-pointer select-none">Simulate Biometric Mismatch</label>
                </div>
                <button onclick="saveDevSettings()"
                    class="w-full py-4 bg-slate-800 text-white font-bold rounded-2xl active:scale-95 transition-transform">
                    Save and Refresh
                </button>
            </div>
        </div>
    </div>

    <!-- Biometric Registration Modal -->
    <div id="biometricModal"
        class="fixed inset-0 bg-slate-900/90 backdrop-blur-lg z-[150] hidden flex-col items-center justify-center p-6 pb-12">
        <div class="w-full max-w-sm space-y-6 animate-in fade-in zoom-in-95 duration-500 text-center">
            
            <!-- Scanning Visual Header -->
            <div class="space-y-2">
                <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400">
                    <i class="fas fa-eye text-xl animate-pulse"></i>
                </div>
                <h3 class="text-2xl font-black text-white tracking-tight">Biometric Enrollment</h3>
                <p id="bioInstructions" class="text-slate-400 text-xs px-6 font-semibold">
                    First login detected. Let's register your face and eye identity.
                </p>
            </div>

            <!-- Viewfinder Area -->
            <div class="relative w-72 h-72 mx-auto rounded-[48px] overflow-hidden border-4 border-slate-700 bg-slate-950 flex items-center justify-center shadow-2xl">
                <!-- Camera Feed -->
                <video id="bioCameraFeed" autoplay playsinline class="w-full h-full object-cover" style="transform: scaleX(-1); -webkit-transform: scaleX(-1);"></video>
                
                <!-- Scanning Overlay Guidelines -->
                <div class="absolute inset-0 border-[24px] border-slate-950/80 pointer-events-none"></div>
                
                <!-- Face Oval Guide -->
                <div class="absolute inset-x-8 inset-y-6 rounded-[50%] border-2 border-dashed border-blue-500/60 pointer-events-none flex flex-col items-center justify-center">
                    <!-- Eye guidelines -->
                    <div class="w-full flex justify-around px-8 mt-12">
                        <div class="w-10 h-6 border border-blue-400/50 rounded-md bg-blue-500/5"></div>
                        <div class="w-10 h-6 border border-blue-400/50 rounded-md bg-blue-500/5"></div>
                    </div>
                </div>

                <!-- Laser Scanning Line -->
                <div class="absolute inset-x-0 h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent top-0 animate-[scan_3s_infinite_linear] shadow-[0_0_8px_#3b82f6] pointer-events-none"></div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3 px-4">
                <button id="captureBioBtn"
                    class="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-3xl active:scale-95 transition-all flex items-center justify-center space-x-3 shadow-lg shadow-blue-500/30">
                    <i class="fas fa-camera"></i>
                    <span>Scan & Register</span>
                </button>
                <button id="cancelBioBtn"
                    class="w-full py-4 bg-slate-800 hover:bg-slate-700 text-slate-400 font-bold rounded-3xl active:scale-95 transition-all text-xs">
                    Cancel Login
                </button>
            </div>
        </div>
    </div>

    <!-- Premium Toast -->
    <div id="toast"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-8 py-4 rounded-3xl text-xs font-bold bg-opacity-95 hidden transition-all duration-300 z-50 shadow-2xl border border-white/10">
    </div>

    <script>

        (function () {
            const user = localStorage.getItem('mobile_user');
            if (user) window.location.href = 'mobile_dashboard.html';
        })();

        let clickCount = 0;
        function handleLogoClick() {
            clickCount++;
            if (clickCount >= 5) {
                toggleDevSettings();
                clickCount = 0;
            }
            setTimeout(() => { clickCount = 0; }, 2000);
        }

        function toggleDevSettings() {
            const modal = document.getElementById('devSettingsModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            document.getElementById('customApiInput').value = localStorage.getItem('custom_api_base') || '';
            document.getElementById('testMismatchCheckbox').checked = localStorage.getItem('test_biometric_mismatch') === 'true';
        }

        function saveDevSettings() {
            const ip = document.getElementById('customApiInput').value.trim();
            if (ip) localStorage.setItem('custom_api_base', ip);
            else localStorage.removeItem('custom_api_base');
            
            const mismatch = document.getElementById('testMismatchCheckbox').checked;
            if (mismatch) localStorage.setItem('test_biometric_mismatch', 'true');
            else localStorage.removeItem('test_biometric_mismatch');
            
            window.location.reload();
        }

        let bioStream = null;

        function startBiometricRegistration(emp, API_BASE, token) {
            const modal = document.getElementById('biometricModal');
            const video = document.getElementById('bioCameraFeed');
            const captureBtn = document.getElementById('captureBioBtn');
            const cancelBtn = document.getElementById('cancelBioBtn');
            const instructions = document.getElementById('bioInstructions');

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    bioStream = stream;
                    video.srcObject = stream;
                    video.play();
                })
                .catch(err => {
                    console.error("Camera error during biometric registration:", err);
                    showToast("Camera access required for registration");
                    closeBioModal();
                });

            function closeBioModal() {
                if (bioStream) {
                    bioStream.getTracks().forEach(track => track.stop());
                    bioStream = null;
                }
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }

            cancelBtn.onclick = () => {
                closeBioModal();
            };

            captureBtn.onclick = async () => {
                captureBtn.disabled = true;
                captureBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
                instructions.textContent = "Scanning face and eye coordinates...";

                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('selfie', blob, `${emp.employeeId}_ref.jpg`);

                        try {
                            const registerRes = await fetch(`${API_BASE}/employees/${emp.employeeId}/register-biometrics`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` },
                                body: formData
                            });

                            if (!registerRes.ok) throw new Error("Registration API returned error");

                            instructions.textContent = "Identity verified and registered! Loading...";
                            showToast("Biometrics Registered Successfully! ✨");

                            setTimeout(() => {
                                closeBioModal();
                                localStorage.setItem('mobile_user', JSON.stringify({
                                    id: emp.id || emp._id,
                                    name: emp.name,
                                    employeeId: emp.employeeId,
                                    designation: emp.designation,
                                    project: emp.project
                                }));
                                window.location.href = 'mobile_dashboard.html';
                            }, 1500);

                        } catch (err) {
                            console.error(err);
                            instructions.textContent = "Registration failed. Try again.";
                            showToast("Registration failed. Try again.");
                            captureBtn.disabled = false;
                            captureBtn.innerHTML = '<i class="fas fa-camera"></i> <span>Scan & Register</span>';
                        }
                    }, 'image/jpeg', 0.85);

                } catch (err) {
                    console.error(err);
                    instructions.textContent = "Camera capture failed.";
                    captureBtn.disabled = false;
                    captureBtn.innerHTML = '<i class="fas fa-camera"></i> <span>Scan & Register</span>';
                }
            };
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';

            const employeeId = document.getElementById('employeeId').value;
            const password = document.getElementById('password').value;

            try {
                // Determine API Base with Developer Override
                const customBase = localStorage.getItem('custom_api_base');
                const API_BASE = customBase || ((window.Capacitor || window.location.protocol.startsWith('http') === false)
                    ? 'http://192.168.12.106:5000/api'
                    : (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '192.168.12.106' ? 'http://192.168.12.106:5000/api' : '/api'));

                // Secure Login with Password
                const loginRes = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: employeeId, password: password })
                });

                if (!loginRes.ok) {
                    const errData = await loginRes.json();
                    throw new Error(errData.error || 'Identity not verified');
                }

                const result = await loginRes.json();
                const { user, token } = result;

                // Save Auth
                localStorage.setItem('token', token);
                localStorage.setItem('mobile_user', JSON.stringify({
                    id: user.id || user._id,
                    name: user.name,
                    employeeId: user.employeeId,
                    designation: user.designation || 'Staff',
                    project: user.project || 'Metal Group'
                }));

                // Fetch full employee details to check biometrics
                const empRes = await fetch(`${API_BASE}/employees/${user.employeeId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const emp = await empRes.json();

                if (!emp.isBiometricRegistered) {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    startBiometricRegistration(emp, API_BASE, token);
                    return;
                }

                window.location.href = 'mobile_dashboard.html';

            } catch (err) {
                showToast(err.message || 'Verification Failed');
                console.error(err);
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden', 'opacity-0', 'translate-y-10');
            t.classList.add('animate-bounce');
            setTimeout(() => {
                t.classList.add('opacity-0', 'translate-y-10');
                setTimeout(() => t.classList.add('hidden'), 300);
            }, 3000);
        }
    </script>
</body>

</html>
