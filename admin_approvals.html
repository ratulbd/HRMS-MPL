<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Admin Approvals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<style>
        body { background-color: var(--bg-page); }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.025em; }
        .text-micro { font-size: 0.6875rem; font-weight: 600; line-height: 1.4; letter-spacing: 0.06em; text-transform: uppercase; }
    </style>
</head>

<body class="bg-gray-50 font-inter">

    <!-- Sidebar Navigation -->
    <div id="sidebar"
        class="fixed left-0 top-0 h-screen transition-all duration-300 z-50 sidebar-expanded bg-[#0f1623] border-r border-[rgba(99,102,241,0.08)]">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between p-4 border-b border-gray-800">
                <div class="flex items-center space-x-3">
                    <img src="/assets/logo.png" alt="Logo" class="h-8 w-auto">
                    <span class="font-display text-lg font-bold text-white sidebar-text">HRMS</span>
                </div>
                <button id="sidebarToggle" class="p-2 rounded-lg transition-colors text-[#8b92a5] hover:text-white hover:bg-[#1a2235]">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 px-2">
                <div class="sidebar-section-label px-3 pb-2">Actions</div>
                <button onclick="window.location.href='/index.html'" class="sidebar-btn">
                    <i class="fas fa-users sidebar-icon"></i>
                    <span class="sidebar-text">Directory</span>
                </button>
                <div class="sidebar-section-label px-3 pt-5 pb-2">Insights</div>
                <button onclick="window.location.href='/admin_approvals.html'" class="sidebar-btn sidebar-btn-primary">
                    <i class="fas fa-check-circle sidebar-icon"></i>
                    <span class="sidebar-text">Approval</span>
                </button>
                <button onclick="window.location.href='/analytics.html'" class="sidebar-btn">
                    <i class="fas fa-chart-line sidebar-icon"></i>
                    <span class="sidebar-text">Analytics</span>
                </button>
                <div class="sidebar-section-label px-3 pt-5 pb-2">Admin</div>
                <button onclick="window.location.href='/admin/index.html'" class="sidebar-btn">
                    <i class="fas fa-cog sidebar-icon"></i>
                    <span class="sidebar-text">Admin Panel</span>
                </button>
                <button onclick="window.location.href='/policies.html'" class="sidebar-btn">
                    <i class="fas fa-file-contract sidebar-icon"></i>
                    <span class="sidebar-text">Policies</span>
                </button>
            </nav>
            <div class="border-t border-[rgba(99,102,241,0.08)] p-2">
                <button id="logoutBtn" class="sidebar-btn sidebar-btn-danger">
                    <i class="fas fa-sign-out-alt sidebar-icon"></i>
                    <span class="sidebar-text">Logout</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Top Bar (Mobile Friendly) -->
    <div class="fixed top-0 left-0 right-0 h-14 flex items-center px-4 z-40 lg:hidden" style="background: rgba(255,255,255,0.95); backdrop-filter: blur(12px) saturate(180%); border-bottom: 1px solid var(--border-color);">
        <button id="mobileSidebarToggle" class="p-2 rounded-lg mr-3" style="color: var(--text-secondary);">
            <i class="fas fa-bars"></i>
        </button>
        <img src="/assets/logo.png" alt="Logo" class="h-7 w-auto">
        <span class="font-display text-lg font-bold text-gray-900 ml-2">HRMS</span>
    </div>

    <div id="app" class="content-wrapper max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-4 sm:pb-6 lg:pb-8 pt-6 sm:pt-8 lg:pt-10">
        <header class="mb-8" id="dashboard-header">
            <p class="text-micro mb-1" style="color: var(--text-muted);">HRMS / Approvals</p>
            <h1 class="font-display text-hero flex items-center" style="color: var(--text-primary);">
                <i class="fas fa-shield-alt mr-3" style="color: var(--primary);"></i> Approval Dashboard
            </h1>
            <p class="text-body mt-1" style="color: var(--text-secondary);" id="approverInfo">Loading approver data...</p>
        </header>

        <main>

        <!-- Stats & Tabs -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div id="tabPending" onclick="switchTab('Pending')"
                class="stat-card active">
                <div class="text-micro" style="color: var(--text-muted); margin-bottom: 0.25rem;">Waiting Action</div>
                <div id="countPending" class="text-3xl font-bold text-gray-900">0</div>
                <div class="mt-2 h-1 w-8 rounded-full" style="background: var(--primary-light);"></div>
            </div>
            <div id="tabApproved" onclick="switchTab('Approved')"
                class="stat-card opacity-60 hover:opacity-100 transition-opacity">
                <div class="text-micro" style="color: var(--text-muted); margin-bottom: 0.25rem;">Approved History</div>
                <div id="countApproved" class="text-3xl font-bold text-gray-900">-</div>
                <div class="mt-2 h-1 w-8 rounded-full bg-emerald-100"></div>
            </div>
            <div id="tabRejected" onclick="switchTab('Rejected')"
                class="stat-card opacity-60 hover:opacity-100 transition-opacity">
                <div class="text-micro" style="color: var(--text-muted); margin-bottom: 0.25rem;">Rejected History</div>
                <div id="countRejected" class="text-3xl font-bold text-gray-900">-</div>
                <div class="mt-2 h-1 w-8 rounded-full bg-red-100"></div>
            </div>
        </div>

        <!-- Approval List -->
        <div class="space-y-4" id="approvalList">
            <div class="text-center py-20 text-gray-400">
                <div class="spinner mb-4" style="width:32px;height:32px;margin:0 auto 16px;"></div>
                <p>Loading requests...</p>
            </div>
        </div>
    </main>
    </div>

    <!-- Approval Modal -->
    <div id="actionModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-8 w-full max-w-md shadow-xl border border-gray-200">
            <h2 id="modalTitle" class="text-xl font-bold text-gray-900 mb-2">Process Request</h2>
            <p id="modalSub" class="text-sm text-gray-500 mb-6"></p>

            <label class="block text-sm font-semibold text-gray-700 mb-2">Comments (Optional)</label>
            <textarea id="modalComments"
                class="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl mb-6 focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-[var(--primary)] transition-all"
                rows="3" placeholder="Add a note..."></textarea>

            <div class="flex space-x-4">
                <button onclick="closeModal()"
                    class="flex-1 px-6 py-3 font-semibold rounded-xl hover:bg-gray-50 transition-colors border" style="color: var(--text-secondary); border-color: var(--border-color);">Cancel</button>
                <button id="confirmActionBtn"
                    class="flex-1 px-6 py-3 text-white font-semibold rounded-xl shadow-md transition-all" style="background: var(--primary);">Confirm</button>
            </div>
        </div>
    </div>

    <script src="js/admin_approvals.js"></script>
</body>

</html>
